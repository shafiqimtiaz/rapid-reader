<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rapid Read — Options</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e7e9ee; margin: 0; padding: 40px 24px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 24px; }
    h2 { font-size: 16px; margin: 32px 0 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; }
    section { background: #171a21; border: 1px solid #232734; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    label { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
    input[type="range"] { flex: 1; }
    .preview { margin-top: 16px; padding: 16px; border-radius: 8px; text-align: center; font-size: 40px; font-weight: 600; }
    .preview .anchor { color: #f87171; }
    .row { display: flex; gap: 16px; }
    .stat { flex: 1; background: #171a21; border: 1px solid #232734; border-radius: 12px; padding: 16px; text-align: center; }
    .stat .num { font-size: 28px; font-weight: 700; }
    .stat .lbl { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
    svg { width: 100%; height: 120px; }
    button.danger { background: #3f1d1d; color: #fca5a5; border: 1px solid #7f1d1d; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
    .empty { color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Rapid Read</h1>

    <h2>Settings</h2>
    <section>
      <label>Speed: <input type="range" id="wpm" min="100" max="1000" step="10"> <span id="wpmVal">300 wpm</span></label>
      <div class="row">
        <label><input type="radio" name="fontSize" value="small"> Small</label>
        <label><input type="radio" name="fontSize" value="medium"> Medium</label>
        <label><input type="radio" name="fontSize" value="large"> Large</label>
      </div>
      <div class="row">
        <label><input type="radio" name="theme" value="dark"> Dark</label>
        <label><input type="radio" name="theme" value="light"> Light</label>
        <label><input type="radio" name="theme" value="sepia"> Sepia</label>
      </div>
      <label><input type="checkbox" id="smartPauses"> Smart pauses on punctuation</label>
      <div class="preview" id="preview">read<span class="anchor">i</span>ng</div>
    </section>

    <h2>Stats</h2>
    <div class="row" id="totals"></div>
    <section>
      <svg id="chart" viewBox="0 0 700 120" preserveAspectRatio="none"></svg>
      <p id="chartEmpty" class="empty" hidden>No reading yet — read something with Rapid Read first.</p>
    </section>
    <button class="danger" id="reset">Reset stats</button>
  </div>
  <script type="module" src="/src/options/index.ts"></script>
</body>
</html>
